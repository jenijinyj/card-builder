<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan Your Sabah Getaway — Card Section</title>

<!-- ============================================================
     组件样式（这一段可以原样贴进投放后台）
     ============================================================ -->
<style id="sbg-component-style">
.sbg{
  --sbg-ink:#0f294d;
  --sbg-muted:#4a5f7d;
  --sbg-line:#e7edf6;
  --sbg-brand:#287dfa;
  --sbg-tag:#1a6fe0;
  --sbg-tagbg:#eaf2ff;
  --sbg-radius:16px;
  box-sizing:border-box;
  max-width:1160px;          /* 内容宽度 1160，和页面其他模块对齐 */
  margin:0 auto;
  padding:48px 0 56px;
  background:transparent;     /* 背景透明，直接透出页面本身的底色 */
  color:var(--sbg-ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
.sbg *,.sbg *::before,.sbg *::after{box-sizing:border-box}

.sbg__head{display:flex;flex-direction:column;gap:8px;margin:0 0 26px;text-align:center}
.sbg__title{margin:0;font-size:30px;line-height:1.2;font-weight:800;letter-spacing:-.3px;color:var(--sbg-heading,#0f294d)}
.sbg__sub{margin:0 auto;font-size:15px;line-height:1.6;color:var(--sbg-sub,#4a5f7d);max-width:680px}

/* 网格：列数按卡片数量自动算（JS 里的 colsFor），默认 stretch —— 同一行卡片天然等高
   4 张 → 4 列；5 张 → 3 列（3+2）；6 张 → 3 列（3×2）；8 张 → 4 列 */
.sbg__grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:20px;
  align-items:stretch;
}
.sbg__grid[data-cols="1"]{grid-template-columns:minmax(0,1fr)}
.sbg__grid[data-cols="2"]{grid-template-columns:repeat(2,minmax(0,1fr))}
.sbg__grid[data-cols="3"]{grid-template-columns:repeat(3,minmax(0,1fr))}
.sbg__grid[data-cols="4"]{grid-template-columns:repeat(4,minmax(0,1fr))}

/* 平板：最多两列 */
@media (max-width:1023px){
  .sbg__grid[data-cols="3"],
  .sbg__grid[data-cols="4"]{grid-template-columns:repeat(2,minmax(0,1fr))}
}

.sbg-card{
  display:flex;              /* 竖向弹性布局，卡片自己撑满整行高度 */
  flex-direction:column;
  height:100%;
  background:#fff;
  /* 设了文字区底色时，边框自动取同一个颜色（--sbg-cardline 由每张卡的内联变量给出） */
  border:2px solid var(--sbg-cardline, var(--sbg-line));
  border-radius:var(--sbg-radius);
  overflow:hidden;
  text-decoration:none;
  color:inherit;
  box-shadow:0 2px 12px rgba(15,41,77,.06);
  transition:transform .22s ease, box-shadow .22s ease, border-color .22s ease;
}
/* 只有填了链接的卡片才有悬停/可点击状态 */
.sbg-card:not(.sbg-card--static):hover{
  transform:translateY(-4px);
  box-shadow:0 12px 26px rgba(15,41,77,.14);
  border-color:var(--sbg-cardline-hover, #d8e3f3);
}
.sbg-card--static{cursor:default}

/* 投放后台常有全局兜底样式给 a / 卡片补一条白边（有时还带 !important），
   这里用更高优先级 + !important 兜一层，保证边框颜色一定按卡片自己的底色走 */
.sbg .sbg__grid .sbg-card{
  border-width:2px !important;
  border-style:solid !important;
  border-color:var(--sbg-cardline, var(--sbg-line)) !important;
}

/* 图片区：强制 4:3，object-fit:cover 自动裁切，不需要人工对齐 */
.sbg-card__media{
  position:relative;
  width:100%;
  aspect-ratio:4 / 3;
  background:linear-gradient(135deg,#dbe7f7 0%,#eef4fb 55%,#e3edf9 100%);
  overflow:hidden;
}
.sbg-card__slide{
  position:absolute;inset:0;
  width:100%;height:100%;
  object-fit:cover;object-position:center;
  opacity:0;
  transition:opacity .45s ease, transform .35s ease;
}
.sbg-card__slide.is-active{opacity:1}
.sbg-card:not(.sbg-card--static):hover .sbg-card__slide.is-active{transform:scale(1.04)}

/* 轮播圆点 */
.sbg-card__dots{
  position:absolute;left:50%;bottom:12px;transform:translateX(-50%);
  display:flex;gap:5px;padding:4px 7px;border-radius:999px;
  background:rgba(15,26,46,.32);
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  z-index:2;
}
.sbg-card__dot{
  width:22px;height:3px;padding:0;border:0;border-radius:2px;
  background:rgba(255,255,255,.55);cursor:pointer;
  transition:background .2s ease, transform .2s ease;
}
.sbg-card__dot.is-active{background:#4f86ff}
.sbg-card__dot:hover{transform:scaleY(1.8)}

/* 没有填图片时的占位块 */
.sbg-card__ph{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  text-align:center;
  font-size:12px;line-height:1.5;font-weight:600;letter-spacing:.4px;
  color:#8ea3bd;text-transform:uppercase;
  padding:16px;
}

/* 文字区：描述吃掉剩余高度，底部链接永远贴底 —— 卡片长短自动一致 */
.sbg-card__body{
  display:flex;
  flex-direction:column;
  gap:8px;
  flex:1;
  padding:16px 18px 18px;
  background:var(--sbg-body,transparent);   /* 每张卡的文字区底色，留空就是透明 */
}
/* 整段文字居中（在编辑器里切「文字对齐」） */
.sbg[data-align="center"] .sbg-card__body{text-align:center}
.sbg[data-align="center"] .sbg-card__tag{align-self:center}
.sbg[data-align="center"] .sbg-card__link{align-self:center}
.sbg-card__tag{
  align-self:flex-start;
  display:inline-block;
  font-size:11px;
  line-height:1.6;
  font-weight:700;
  letter-spacing:.5px;
  text-transform:uppercase;
  color:var(--sbg-tag,#1a6fe0);
  background:var(--sbg-tagbg,#eaf2ff);
  border-radius:999px;
  padding:2px 10px;
}
.sbg-card__title{
  margin:0;
  font-size:18px;
  line-height:1.3;
  font-weight:700;
  color:var(--sbg-cardtitle,#0f294d);
  /* 不预留空行：标题一行就是一行，下面紧接描述 */
}
.sbg-card__text{
  margin:0;
  flex:1;                    /* 撑满剩余空间，把链接压到底部 */
  font-size:14px;
  line-height:1.6;
  color:var(--sbg-text,#4a5f7d);
  /* 不限制行数：文字完整显示，卡片高度由同一行最高的那张决定 */
}
.sbg-card__link{
  margin-top:10px;
  display:inline-flex;
  align-items:center;
  gap:4px;
  font-size:14px;
  font-weight:600;
  color:var(--sbg-brand);
}
.sbg-card__link svg{
  width:14px;height:14px;flex:none;
  transition:transform .2s ease;
}
/* 填了文案但没填链接：半透明显示，不可点（深色底上自动变浅） */
.sbg-card__link--off{color:var(--sbg-text,#4a5f7d);opacity:.65;cursor:default}
.sbg-card:not(.sbg-card--static):hover .sbg-card__link svg{transform:translateX(3px)}

/* 视口比 1160 窄时补上左右留白 */
@media (max-width:1200px){
  .sbg{padding-left:24px;padding-right:24px}
}
@media (max-width:640px){
  .sbg{padding:32px 16px 40px}
  .sbg__title{font-size:23px}
  .sbg__sub{font-size:14px}
  .sbg__grid[data-cols]{grid-template-columns:1fr;gap:16px}
  .sbg-card__media{aspect-ratio:2 / 1}   /* 移动端按 2:1 裁切 */
}
</style>

<!-- ============================================================
     页面外壳 + 编辑器样式（这部分不用贴进后台）
     ============================================================ -->
<style>
html,body{margin:0;padding:0}
body{background:#f2f5f9}

/* 编辑按钮 */
.sbg-edit-btn{
  position:fixed;right:22px;bottom:22px;z-index:60;
  display:inline-flex;align-items:center;gap:8px;
  padding:11px 18px;border:0;border-radius:999px;
  background:#0f294d;color:#fff;
  font-size:13px;font-weight:600;font-family:inherit;

}

/* 编辑面板 */
.sbg-editor{

  background:rgba(12,26,46,.55);

.sbg-editor[hidden]{display:none}
/* 编辑面板在组件外面，需要单独补 box-sizing，否则输入框会撑出边界 */
.sbg-editor *,.sbg-editor *::before,.sbg-editor *::after{box-sizing:border-box}
.sbg-editor__box{
  width:min(760px,100%);height:min(820px,90vh);
  display:flex;flex-direction:column;
  background:#fff;border-radius:16px;overflow:hidden;

.sbg-editor__bar{

}

.sbg-editor__hint{font-size:12px;color:#7c8ea8;flex:1;line-height:1.4}
.sbg-editor__saved{
  font-size:12px;font-weight:600;color:#2e9e5b;white-space:nowrap;

}
.sbg-editor__saved.on{opacity:1}
.sbg-editor__saved.bad{color:#c62828}
.sbg-editor__close{
  border:0;background:#f1f5fa;color:#5b7291;

}
.sbg-editor__close:hover{background:#e6edf7;color:#0f294d}

.sbg-editor__scroll{flex:1;overflow:auto;padding:16px 18px 4px;background:#fbfcfe}

/* 表单 */
.sbg-field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.sbg-field > span{
  font-size:11px;font-weight:700;letter-spacing:.4px;
  text-transform:uppercase;color:#7c8ea8;
}
.sbg-field input,.sbg-field textarea{
  width:100%;border:1px solid #dde6f2;border-radius:9px;
  padding:9px 11px;
  font:13px/1.5 inherit;color:#1d3557;background:#fff;
  outline:none;resize:vertical;
}
/* 颜色：左边色块可点选，右边直接填色号 A12132 */
.sbg-color{display:flex;gap:6px;align-items:center}
.sbg-color input[type="color"]{
  width:38px;height:38px;flex:none;
  padding:3px;border:1px solid #dde6f2;border-radius:9px;
  background:#fff;cursor:pointer;
}
.sbg-color input[type="color"]:focus{border-color:#8ab4f8;box-shadow:0 0 0 3px rgba(40,125,250,.12)}
.sbg-color .sbg-hex{
  flex:1;min-width:0;width:auto;
  border:1px solid #dde6f2;border-radius:9px;padding:9px 10px;
  font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  letter-spacing:.6px;text-transform:uppercase;
  color:#1d3557;background:#fff;outline:none;
}
.sbg-color .sbg-hex::placeholder{letter-spacing:0;text-transform:none;color:#a9b8cc}
.sbg-color .sbg-hex:focus{border-color:#8ab4f8;box-shadow:0 0 0 3px rgba(40,125,250,.12)}
.sbg-hint{font-size:11px;color:#9aabc1;margin-top:2px}
.sbg-field input:focus,.sbg-field textarea:focus{
  border-color:#8ab4f8;box-shadow:0 0 0 3px rgba(40,125,250,.12);
}
.sbg-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.sbg-row--4{grid-template-columns:repeat(4,1fr)}
@media (max-width:620px){.sbg-row--4{grid-template-columns:repeat(2,1fr)}}
.sbg-row .sbg-field{margin-bottom:0}
.sbg-field select{
  width:100%;border:1px solid #dde6f2;border-radius:9px;
  padding:9px 11px;font:13px/1.5 inherit;color:#1d3557;background:#fff;
  outline:none;cursor:pointer;
}
.sbg-field select:focus{border-color:#8ab4f8;box-shadow:0 0 0 3px rgba(40,125,250,.12)}

/* 每张卡片里的图片列表 */
.sbg-imgs{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.sbg-imgitem{display:grid;grid-template-columns:1fr 54px 26px 26px 26px;gap:6px;align-items:center}
.sbg-imgitem input{
  width:100%;border:1px solid #dde6f2;border-radius:8px;
  padding:7px 9px;font:12px/1.4 inherit;color:#1d3557;background:#fff;outline:none;
}
.sbg-imgitem input:focus{border-color:#8ab4f8;box-shadow:0 0 0 3px rgba(40,125,250,.12)}
.sbg-thumb{
  width:54px;height:40px;border-radius:7px;border:1px dashed #d5e0ee;
  background:#f2f7fd;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  font-size:9px;color:#9fb2c9;
}
.sbg-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.sbg-imgitem button{
  width:26px;height:26px;padding:0;
  border:1px solid #e0e8f2;border-radius:6px;background:#fff;
  color:#5b7291;font-size:12px;line-height:1;cursor:pointer;font-family:inherit;
}
.sbg-imgitem button:hover{background:#f4f8fd}
.sbg-imgitem button:disabled{opacity:.35;cursor:default}
.sbg-imgitem button.danger:hover{background:#fff1f1;border-color:#f3c2c2;color:#c62828}

.sbg-addimg{
  width:100%;padding:8px;border:1px dashed #c7d8ec;border-radius:9px;
  background:#fff;color:#287dfa;font-size:12px;font-weight:700;
  cursor:pointer;font-family:inherit;
}
.sbg-addimg:hover{background:#f5f9ff;border-color:#9dc0ea}

/* 文字区底色：色块 + 清除 */
.sbg-bgrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end;margin-bottom:12px}
.sbg-bgrow .sbg-field{margin-bottom:0}
.sbg-clearbg{
  height:38px;padding:0 14px;border:1px solid #d9e3f0;border-radius:9px;
  background:#fff;color:#5b7291;font-size:12px;font-weight:600;
  cursor:pointer;font-family:inherit;
}
.sbg-clearbg:hover{background:#f5f9ff;border-color:#c3d6ee}

/* 单张卡片：带一条浅蓝色标题栏 + 阴影，卡片之间一眼能分开 */
.sbg-carditem{
  border:1px solid #cfdff1;border-radius:12px;
  background:#fff;margin-bottom:18px;overflow:hidden;
  box-shadow:0 1px 5px rgba(15,41,77,.08);
  padding:0 14px 2px;
}
.sbg-carditem__head{
  display:flex;align-items:center;justify-content:space-between;
  margin:0 -14px 12px;padding:9px 14px;
  background:#eaf2fc;border-bottom:1px solid #d7e5f5;
}
.sbg-carditem__head b{font-size:13px;color:#0f294d;letter-spacing:.2px}
.sbg-carditem__head .tools{display:flex;gap:6px}
.tools button{
  border:1px solid #e0e8f2;background:#fff;border-radius:7px;
  padding:3px 8px;font-size:12px;color:#5b7291;
  cursor:pointer;font-family:inherit;
}
.tools button:hover{background:#f4f8fd}
.tools button:disabled{opacity:.35;cursor:default}
.tools button.danger:hover{background:#fff1f1;border-color:#f3c2c2;color:#c62828}

.sbg-add{
  width:100%;padding:11px;margin-bottom:14px;
  border:1px dashed #c7d8ec;border-radius:11px;background:#fff;
  color:#287dfa;font-size:13px;font-weight:700;
  cursor:pointer;font-family:inherit;
}
.sbg-add:hover{background:#f5f9ff;border-color:#9dc0ea}

.sbg-editor__actions{
  display:flex;gap:10px;align-items:center;
  padding:12px 18px;border-top:1px solid #e8eef6;background:#fff;
}
.sbg-editor__actions button{
  padding:9px 18px;border-radius:9px;border:1px solid #d9e3f0;
  background:#fff;color:#31465f;font-size:13px;font-weight:600;
  font-family:inherit;cursor:pointer;
}
.sbg-editor__actions button:hover{background:#f5f9ff;border-color:#c3d6ee}
.sbg-editor__actions button.primary{background:#287dfa;border-color:#287dfa;color:#fff}
.sbg-editor__actions button.primary:hover{background:#1a6fe0;border-color:#1a6fe0}
.sbg-editor__actions .spacer{flex:1}

/* 轻提示 */
.sbg-toast{
  position:fixed;left:50%;bottom:36px;transform:translate(-50%,12px);
  z-index:80;padding:10px 20px;border-radius:10px;
  background:#0f294d;color:#fff;font-size:13px;font-weight:600;
  opacity:0;pointer-events:none;transition:opacity .2s ease, transform .2s ease;
}
.sbg-toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>

<body>

<!-- 组件本体 -->
<section class="sbg" id="sbgSection">
  <div class="sbg__head">
    <h2 class="sbg__title" id="sbgTitle">Plan Your Sabah Getaway</h2>
    <p class="sbg__sub" id="sbgSub"></p>
  </div>
  <div class="sbg__grid" id="sbgGrid"></div>
</section>

<!-- 编辑按钮 + 面板 -->
<button class="sbg-edit-btn" id="sbgEditBtn" type="button">✎ 编辑内容</button>

<div class="sbg-editor" id="sbgEditor" hidden>
  <div class="sbg-editor__box">
    <div class="sbg-editor__bar">
      <strong>内容编辑</strong>
      <span class="sbg-editor__hint">改动会自动保存，刷新、关掉都不会丢</span>
      <span class="sbg-editor__saved" id="sbgSaved"></span>
      <button class="sbg-editor__close" id="sbgClose" type="button">✕</button>
    </div>
    <div class="sbg-editor__scroll" id="sbgForm"></div>
    <div class="sbg-editor__actions">
      <button class="primary" id="sbgApply" type="button">保存并预览</button>
      <button id="sbgCopy" type="button">复制静态 HTML</button>
      <span class="spacer"></span>
      <button id="sbgReset" type="button">恢复默认</button>
    </div>
  </div>
</div>

<div class="sbg-toast" id="sbgToast"></div>

<script>
/* ============================================================
   1. 内容数据 —— 代码改法：只改这一块
   ------------------------------------------------------------
   tag      : 卡片左上角的小标签（留空则隐藏）
   title    : 卡片标题
   text     : 卡片描述
   images   : 图片地址数组，多于一张自动轮播（圆点/滑动）
   bg       : 文字区背景色（留空 = 透明；填了以后卡片边框自动同色）
   link     : 点卡片跳转的链接（留空则整张卡片不可点击）
   linkText : 底部链接文案（留空则不显示）
   align    : 卡片文字对齐 left / center
   ============================================================ */
const DEFAULT_SECTION = {
  title: "Plan Your Sabah Getaway",
  subtitle: "Four bases, four different Sabahs. Pick one — or string them together for a longer trip.",
  headingColor: "#0f294d",
  subColor: "#4a5f7d",
  cardTitleColor: "#0f294d",
  textColor: "#4a5f7d",
  tagColor: "#1a6fe0",
  tagBgColor: "#eaf2ff",
  align: "left",
  cards: [
    {
      tag: "City & Islands",
      title: "Kota Kinabalu",
      text: "The capital and the easiest way in. Sunset at Tanjung Aru, island hopping in Tunku Abdul Rahman Marine Park, and seafood along the waterfront.",
      images: [],
      bg: "",
      link: "",
      linkText: "Explore hotels"
    },
    {
      tag: "Diving",
      title: "Semporna",
      text: "The jump-off point for Sipadan and Mabul. Turquoise water, world-class dive sites and stilt villages built straight over the reef.",
      images: [],
      bg: "",
      link: "",
      linkText: "Explore hotels"
    },
    {
      tag: "Wildlife",
      title: "Sandakan",
      text: "Sabah's wild east. Meet orphaned orangutans at Sepilok, cruise the Kinabatangan for proboscis monkeys, and catch the turtle islands at dusk.",
      images: [],
      bg: "",
      link: "",
      linkText: "Explore hotels"
    },
    {
      tag: "Highlands",
      title: "Kundasang",
      text: "Cool air and mountain views under Mount Kinabalu. Vegetable farms, grazing dairy cows and sunrises that break above a sea of clouds.",
      images: [],
      bg: "",
      link: "",
      linkText: "Explore hotels"
    }
  ]
};

/* ============================================================
   2. 渲染（一般不用改）
   ============================================================ */
/* 内容自动存在本机浏览器里：改一个字就存一次，刷新、关掉都不会丢 */
const STORE_KEY = "sbg_section_v2";
const LEGACY_KEY = "sbg_section_v1";

/* 兼容旧数据：原来的单图 img 自动转成 images 数组 */
function normalize(data){
  const out = clone(data);
  out.cards = (out.cards || []).map((c) => {
    const card = Object.assign(
      { tag: "", title: "", text: "", images: [], bg: "", link: "", linkText: "" },
      c
    );
    if (!Array.isArray(card.images)) {
      card.images = String(card.img || "").trim() ? [String(card.img)] : [];
    }
    delete card.img;
    return card;
  });
  if (out.align !== "center") out.align = "left";
  return out;
}

function readStore(key){
  try{
    const raw = localStorage.getItem(key);
    if(!raw) return null;
    const o = JSON.parse(raw);
    const data = (o && o.data) ? o.data : o;   // 兼容旧格式
    return (data && Array.isArray(data.cards)) ? normalize(data) : null;
  }catch(e){ return null; }
}
function loadSaved(){
  return readStore(STORE_KEY) || readStore(LEGACY_KEY);
}
function showSavedTime(ok){
  const el = $("sbgSaved");
  if(!el) return;
  const d = new Date();
  el.textContent = ok
    ? "已保存 " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0")
    : "浏览器没允许保存";
  el.classList.toggle("bad", !ok);
  el.classList.add("on");
}
function saveData(obj){
  let ok = false;
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify({ at: Date.now(), data: obj }));
    ok = true;
  }catch(e){}
  showSavedTime(ok);
}
function clearLocal(){
  try{
    localStorage.removeItem(STORE_KEY);
    localStorage.removeItem(LEGACY_KEY);
  }catch(e){}
}
let saveTimer = null;
function queueSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { if (DRAFT) saveData(DRAFT); }, 400);
}

let SECTION = loadSaved() || clone(DEFAULT_SECTION);
let DRAFT = null;

function clone(o){ return JSON.parse(JSON.stringify(o)); }
function $(id){ return document.getElementById(id); }

function esc(v){
  return String(v == null ? "" : v).replace(/[&<>"']/g, (m) => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]
  ));
}

/* 判断颜色深浅：文字区填了底色时，自动把字变白或变深 */
function isDarkColor(color){
  const c = String(color || "").trim();
  let r = 255, g = 255, b = 255;
  if (/^#([0-9a-f]{3})$/i.test(c)){
    r = parseInt(c[1] + c[1], 16);
    g = parseInt(c[2] + c[2], 16);
    b = parseInt(c[3] + c[3], 16);
  } else if (/^#([0-9a-f]{6})$/i.test(c)){
    r = parseInt(c.slice(1, 3), 16);
    g = parseInt(c.slice(3, 5), 16);
    b = parseInt(c.slice(5, 7), 16);
  } else {
    return false;
  }
  return (0.299 * r + 0.587 * g + 0.114 * b) / 255 < 0.55;
}

function cardHTML(c){
  const imgs = (c.images || []).map((u) => String(u || "").trim()).filter(Boolean);

  const media = imgs.length
    ? imgs.map((u, i) =>
        `<img class="sbg-card__slide${i === 0 ? " is-active" : ""}" src="${esc(u)}" alt="${esc(c.title)}">`
      ).join("")
    : `<div class="sbg-card__ph">Image</div>`;

  const dots = imgs.length > 1
    ? `<div class="sbg-card__dots">` + imgs.map((_, i) =>
        `<button class="sbg-card__dot${i === 0 ? " is-active" : ""}" type="button" aria-label="第 ${i + 1} 张"></button>`
      ).join("") + `</div>`
    : "";

  /* 文字区底色：填了就上色，并按深浅自动切换文字颜色 */
  const bg = String(c.bg || "").trim();
  const onDark = bg ? isDarkColor(bg) : false;
  const styleAttr = bg
    ? ` style="--sbg-body:${esc(bg)};` +
      /* 边框色直接写成内联声明（而不是只靠 CSS 变量）：
         投放后台的全局样式常常给 a / 卡片加白色描边，只有内联声明才压得住 */
      `border:2px solid ${esc(bg)} !important;` +
      `--sbg-cardline:${esc(bg)};` +
      `--sbg-cardline-hover:${esc(bg)};` +
      `--sbg-cardtitle:${onDark ? "#ffffff" : "#0f294d"};` +
      `--sbg-text:${onDark ? "rgba(255,255,255,.92)" : "#4a5f7d"};` +
      `--sbg-brand:${onDark ? "#ffffff" : "#287dfa"}"`
    : "";

  /* 没填链接（或只填了 #）时，卡片不做成 <a>，也不显示悬停/箭头 */
  const link = String(c.link || "").trim();
  const hasLink = link !== "" && link !== "#";
  const linkTxt = String(c.linkText || "").trim();
  const tag = hasLink ? "a" : "div";
  const attrs = hasLink ? ` href="${esc(link)}"` : "";
  const cls = "sbg-card" + (hasLink ? "" : " sbg-card--static");

  return `<${tag} class="${cls}"${attrs}${styleAttr}>
      <div class="sbg-card__media" data-count="${imgs.length}">${media}${dots}</div>
      <div class="sbg-card__body">
        ${(c.tag || "").trim() ? `<span class="sbg-card__tag">${esc(c.tag)}</span>` : ""}
        ${(c.title || "").trim() ? `<h3 class="sbg-card__title">${esc(c.title)}</h3>` : ""}
        <p class="sbg-card__text">${esc(c.text)}</p>
        ${linkTxt ? (hasLink
          ? `<span class="sbg-card__link">${esc(linkTxt)}
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                   stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M5 12h13M13 6l6 6-6 6"/>
              </svg></span>`
          : `<span class="sbg-card__link sbg-card__link--off">${esc(linkTxt)}</span>`) : ""}
      </div>
    </${tag}>`;
}

/* 单卡轮播：点击圆点 / 手机左右滑。导出时这个函数会被一起复制出去 */
function sbgCarouselInit(media){
  const slides = Array.from(media.querySelectorAll(".sbg-card__slide"));
  const dots = Array.from(media.querySelectorAll(".sbg-card__dot"));
  if (slides.length <= 1) return;

  let index = 0;
  let timer = null;
  const INTERVAL = 4500;          // 自动轮播间隔：4.5 秒

  function go(i){
    index = (i + slides.length) % slides.length;
    slides.forEach((s, k) => s.classList.toggle("is-active", k === index));
    dots.forEach((d, k) => d.classList.toggle("is-active", k === index));
  }
  function stop(){
    if (timer) { clearInterval(timer); timer = null; }
  }
  function play(){
    stop();
    timer = setInterval(() => go(index + 1), INTERVAL);
  }

  dots.forEach((dot, i) => {
    dot.addEventListener("click", (e) => {
      e.preventDefault();
      e.stopPropagation();
      go(i);
      play();
    });
  });

  /* 鼠标移上去暂停，移开继续 */
  media.addEventListener("mouseenter", stop);
  media.addEventListener("mouseleave", play);
  document.addEventListener("visibilitychange", () => {
    document.hidden ? stop() : play();
  });

  let startX = null;
  media.addEventListener("touchstart", (e) => {
    startX = e.touches[0].clientX;
    stop();
  }, { passive: true });
  media.addEventListener("touchend", (e) => {
    if (startX === null) return;
    const dx = e.changedTouches[0].clientX - startX;
    if (Math.abs(dx) > 30) go(index + (dx < 0 ? 1 : -1));
    startX = null;
    play();
  });

  play();
}

/* 列数规则：4 张以内一行摆完；5 张以上在 2–4 列里挑「行数最少、留白最少」的方案
   4→4  5→3  6→3  7→4  8→4  9→3  10→4  12→4 */
function colsFor(n){
  if (n <= 0) return 1;
  if (n <= 4) return n;

  let best = 2, bestRows = Infinity, bestGap = Infinity;
  for (let c = 2; c <= 4; c++){
    const rows = Math.ceil(n / c);
    const gap = rows * c - n;          // 最后一行空出来的位置数
    if (rows < bestRows ||
        (rows === bestRows && gap < bestGap) ||
        (rows === bestRows && gap === bestGap && c > best)) {
      best = c; bestRows = rows; bestGap = gap;
    }
  }
  return best;
}

/* 标题色 / 描述色：写成组件的 CSS 变量，导出时一起带走 */
function applyTheme(src){
  const sec = $("sbgSection");
  sec.style.setProperty("--sbg-heading", src.headingColor || "#0f294d");
  sec.style.setProperty("--sbg-sub", src.subColor || "#4a5f7d");
  sec.style.setProperty("--sbg-cardtitle", src.cardTitleColor || "#0f294d");
  sec.style.setProperty("--sbg-text", src.textColor || "#4a5f7d");
  sec.style.setProperty("--sbg-tag", src.tagColor || "#1a6fe0");
  sec.style.setProperty("--sbg-tagbg", src.tagBgColor || "#eaf2ff");
}

function render(){
  const cards = SECTION.cards || [];
  applyTheme(SECTION);
  $("sbgSection").dataset.align = SECTION.align === "center" ? "center" : "left";
  $("sbgTitle").textContent = SECTION.title || "";
  $("sbgSub").textContent = SECTION.subtitle || "";
  $("sbgGrid").dataset.cols = String(colsFor(cards.length));
  $("sbgGrid").innerHTML = cards.map(cardHTML).join("");
  $("sbgGrid").querySelectorAll(".sbg-card__media").forEach(sbgCarouselInit);
}

render();

/* ============================================================
   3. 编辑器 / 导出（一般不用改）
   ============================================================ */
function toast(msg){
  const t = $("sbgToast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove("show"), 1800);
}

function field(label, key, value, placeholder){
  return `<label class="sbg-field"><span>${label}</span>
    <input data-f="${key}" value="${esc(value)}" placeholder="${esc(placeholder || "")}">
  </label>`;
}

/* 色号处理：A12132 / #A12132 / #a12 都认，统一存成 #A12132 */
function readHex(str){
  const s = String(str || "").trim().replace(/^#/, "").replace(/\s/g, "");
  if (/^[0-9a-fA-F]{3}$/.test(s)) return s.split("").map((c) => c + c).join("").toUpperCase();
  if (/^[0-9a-fA-F]{6}$/.test(s)) return s.toUpperCase();
  return "";
}

/* 一个颜色控件：色块 + 色号输入框；keyAttr 是 data-k 或 data-f */
function colorField(label, keyAttr, value, allowEmpty, hint){
  const hex = readHex(value);
  return `<div class="sbg-field">
    <span>${label}</span>
    <div class="sbg-color">
      <input type="color" class="sbg-swatch" value="${hex ? "#" + hex.toLowerCase() : "#ffffff"}">
      <input type="text" class="sbg-hex" ${keyAttr} value="${hex}" maxlength="7" spellcheck="false"
             placeholder="${allowEmpty ? "留空 = 透明" : "如 A12132"}">
    </div>
    ${hint ? `<div class="sbg-hint">${hint}</div>` : ""}
  </div>`;
}

function imgRowHTML(url, ci, ii, n){
  return `<div class="sbg-imgitem" data-ci="${ci}" data-ii="${ii}">
    <input data-img="${ii}" value="${esc(url)}" placeholder="图片 URL">
    <div class="sbg-thumb">${String(url || "").trim() ? `<img src="${esc(url)}" alt="">` : "IMG"}</div>
    <button type="button" data-imgact="up" ${ii === 0 ? "disabled" : ""}>↑</button>
    <button type="button" data-imgact="down" ${ii === n - 1 ? "disabled" : ""}>↓</button>
    <button type="button" data-imgact="del" class="danger">✕</button>
  </div>`;
}

function cardItemHTML(c, i, n){
  const imgs = c.images || [];
  return `<div class="sbg-carditem" data-i="${i}">
    <div class="sbg-carditem__head">
      <b>卡片 ${i + 1}</b>
      <div class="tools">
        <button type="button" data-act="up" ${i === 0 ? "disabled" : ""}>↑</button>
        <button type="button" data-act="down" ${i === n - 1 ? "disabled" : ""}>↓</button>
        <button type="button" data-act="del" class="danger">删除</button>
      </div>
    </div>

    ${field("标签 tag", "tag", c.tag, "如 Diving")}

    ${field("标题 title", "title", c.title, "卡片标题")}

    <label class="sbg-field"><span>描述 text</span>
      <textarea data-f="text" rows="4" placeholder="卡片描述">${esc(c.text)}</textarea>
    </label>

    <div class="sbg-field">
      <span>图片 images（多张自动轮播）</span>
      <div class="sbg-imgs" data-imgs="${i}">
        ${imgs.map((u, ii) => imgRowHTML(u, i, ii, imgs.length)).join("")}
      </div>
      <button type="button" class="sbg-addimg" data-addimg="${i}">＋ 添加图片</button>
    </div>

    <div class="sbg-bgrow">
      ${colorField("文字区背景色", 'data-f="bg"', c.bg || "", true, "填色号如 A12132，留空则透明")}
      <button type="button" class="sbg-clearbg" data-clearbg>清除（透明）</button>
    </div>

    ${field("链接文案 linkText", "linkText", c.linkText, "如 Explore hotels")}

    ${field("跳转链接 link", "link", c.link, "填 URL；留空则整张卡片不可点击")}
  </div>`;
}

function renderCardImages(ci){
  const box = document.querySelector('.sbg-imgs[data-imgs="' + ci + '"]');
  if (!box) return;
  const arr = DRAFT.cards[ci].images || [];
  box.innerHTML = arr.map((u, ii) => imgRowHTML(u, ci, ii, arr.length)).join("");
}

function buildCards(){
  const box = $("sbgCards");
  if (!box) return;
  box.innerHTML = DRAFT.cards.map((c, i) => cardItemHTML(c, i, DRAFT.cards.length)).join("");
}

function buildForm(){
  const f = $("sbgForm");
  f.innerHTML = `
    <label class="sbg-field"><span>大标题 title</span>
      <input data-k="title" value="${esc(DRAFT.title)}">
    </label>
    <label class="sbg-field"><span>副标题 subtitle</span>
      <input data-k="subtitle" value="${esc(DRAFT.subtitle)}">
    </label>
    <div class="sbg-row sbg-row--4">
      ${colorField("页面标题色", 'data-k="headingColor"', DRAFT.headingColor || "#0f294d")}
      ${colorField("副标题色", 'data-k="subColor"', DRAFT.subColor || "#4a5f7d")}
      ${colorField("卡片标题色", 'data-k="cardTitleColor"', DRAFT.cardTitleColor || "#0f294d")}
      ${colorField("描述文字色", 'data-k="textColor"', DRAFT.textColor || "#4a5f7d")}
    </div>
    <div class="sbg-row">
      ${colorField("标签文字色", 'data-k="tagColor"', DRAFT.tagColor || "#1a6fe0")}
      ${colorField("标签底色", 'data-k="tagBgColor"', DRAFT.tagBgColor || "#eaf2ff")}
    </div>
    <label class="sbg-field"><span>卡片文字对齐</span>
      <select data-k="align">
        <option value="left"${DRAFT.align === "center" ? "" : " selected"}>左对齐</option>
        <option value="center"${DRAFT.align === "center" ? " selected" : ""}>居中</option>
      </select>
    </label>
    <div id="sbgCards"></div>
    <button class="sbg-add" type="button" id="sbgAdd">＋ 添加一张卡片</button>
  `;
  buildCards();
}

/* —— 打开 / 关闭 —— */
function openEditor(){
  DRAFT = clone(SECTION);
  buildForm();
  $("sbgEditor").hidden = false;
  $("sbgForm").scrollTop = 0;
}
/* 关闭面板时把草稿落定，避免「改完直接点叉」丢掉内容 */
function closeEditor(){
  if (DRAFT) {
    SECTION = clone(DRAFT);
    saveData(SECTION);
    render();
  }
  $("sbgEditor").hidden = true;
}

$("sbgEditBtn").addEventListener("click", openEditor);
$("sbgClose").addEventListener("click", closeEditor);
$("sbgEditor").addEventListener("click", (e) => {
  if (e.target === $("sbgEditor")) closeEditor();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && !$("sbgEditor").hidden) closeEditor();
});

/* —— 输入即写进草稿，不重绘，避免光标丢失 —— */
/* 颜色控件：把色号写回数据 */
function writeColor(el, hex){
  if (!el) return;
  if (el.dataset.k) {
    DRAFT[el.dataset.k] = hex ? "#" + hex : "";
    applyTheme(DRAFT);
  } else if (el.dataset.f) {
    const item = el.closest(".sbg-carditem");
    if (item) DRAFT.cards[Number(item.dataset.i)][el.dataset.f] = hex ? "#" + hex : "";
  }
  queueSave();
}

$("sbgForm").addEventListener("input", (e) => {
  const t = e.target;

  /* 点色块选颜色：同步到右边色号 */
  if (t.classList.contains("sbg-swatch")) {
    const hex = readHex(t.value);
    const txt = t.parentElement.querySelector(".sbg-hex");
    if (txt) txt.value = hex;
    writeColor(txt, hex);
    return;
  }

  /* 直接输入色号（A12132 / #A12132 / A12 都认） */
  if (t.classList.contains("sbg-hex")) {
    const hex = readHex(t.value);
    if (hex) {
      const sw = t.parentElement.querySelector(".sbg-swatch");
      if (sw) sw.value = "#" + hex.toLowerCase();
      writeColor(t, hex);
    } else if (!t.value.trim()) {
      writeColor(t, "");          // 留空 = 不设（文字区背景即透明）
    }
    return;
  }

  if (t.dataset.k) {
    DRAFT[t.dataset.k] = t.value;
    applyTheme(DRAFT);
    queueSave();
    return;
  }

  /* 图片地址输入 */
  if (t.dataset.img !== undefined) {
    const row = t.closest(".sbg-imgitem");
    if (!row) return;
    const ci = Number(row.dataset.ci);
    const ii = Number(row.dataset.ii);
    DRAFT.cards[ci].images[ii] = t.value;
    const thumb = row.querySelector(".sbg-thumb");
    if (thumb) {
      thumb.innerHTML = String(t.value || "").trim()
        ? `<img src="${esc(t.value.trim())}" alt="">`
        : "IMG";
    }
    queueSave();
    return;
  }

  if (!t.dataset.f) return;

  const item = t.closest(".sbg-carditem");
  if (!item) return;
  const i = Number(item.dataset.i);
  DRAFT.cards[i][t.dataset.f] = t.value;
  queueSave();
});

/* 色号输错/没输完时，失焦还原成有效值 */
$("sbgForm").addEventListener("blur", (e) => {
  const t = e.target;
  if (!t.classList || !t.classList.contains("sbg-hex")) return;
  const hex = readHex(t.value);
  t.value = hex;
  if (hex) {
    const sw = t.parentElement.querySelector(".sbg-swatch");
    if (sw) sw.value = "#" + hex.toLowerCase();
  }
}, true);

/* —— 排序 / 删除 / 新增 —— */
$("sbgForm").addEventListener("click", (e) => {
  const addBtn = e.target.closest("#sbgAdd");
  if (addBtn) {
    DRAFT.cards.push({ tag: "", title: "New card", text: "", images: [], bg: "", link: "", linkText: "Explore hotels" });
    buildCards();
    queueSave();
    $("sbgForm").scrollTop = $("sbgForm").scrollHeight;
    return;
  }

  /* 加一张图片 */
  const addImg = e.target.closest("button[data-addimg]");
  if (addImg) {
    const ci = Number(addImg.dataset.addimg);
    DRAFT.cards[ci].images.push("");
    renderCardImages(ci);
    queueSave();
    return;
  }

  /* 清除文字区底色 */
  const clearBg = e.target.closest("button[data-clearbg]");
  if (clearBg) {
    const item = clearBg.closest(".sbg-carditem");
    const ci = Number(item.dataset.i);
    DRAFT.cards[ci].bg = "";
    const input = item.querySelector('input[data-f="bg"]');
    if (input) input.value = "";
    const sw = item.querySelector(".sbg-swatch");
    if (sw) sw.value = "#ffffff";
    queueSave();
    return;
  }

  /* 单张图片的排序 / 删除 */
  const imgBtn = e.target.closest("button[data-imgact]");
  if (imgBtn) {
    const row = imgBtn.closest(".sbg-imgitem");
    const ci = Number(row.dataset.ci);
    const ii = Number(row.dataset.ii);
    const arr = DRAFT.cards[ci].images;
    const act = imgBtn.dataset.imgact;
    if (act === "del") {
      arr.splice(ii, 1);
    } else if (act === "up" && ii > 0) {
      [arr[ii - 1], arr[ii]] = [arr[ii], arr[ii - 1]];
    } else if (act === "down" && ii < arr.length - 1) {
      [arr[ii + 1], arr[ii]] = [arr[ii], arr[ii + 1]];
    }
    renderCardImages(ci);
    queueSave();
    return;
  }

  const btn = e.target.closest("button[data-act]");
  if (!btn) return;
  const item = btn.closest(".sbg-carditem");
  const i = Number(item.dataset.i);

  if (btn.dataset.act === "del") {
    DRAFT.cards.splice(i, 1);
  } else if (btn.dataset.act === "up" && i > 0) {
    [DRAFT.cards[i - 1], DRAFT.cards[i]] = [DRAFT.cards[i], DRAFT.cards[i - 1]];
  } else if (btn.dataset.act === "down" && i < DRAFT.cards.length - 1) {
    [DRAFT.cards[i + 1], DRAFT.cards[i]] = [DRAFT.cards[i], DRAFT.cards[i + 1]];
  }
  buildCards();
  queueSave();
});

/* —— 应用 —— */
$("sbgApply").addEventListener("click", () => {
  SECTION = clone(DRAFT);
  saveData(SECTION);
  render();
  $("sbgEditor").hidden = true;
  toast("已保存");
});

/* —— 恢复默认 —— */
$("sbgReset").addEventListener("click", () => {
  DRAFT = clone(DEFAULT_SECTION);
  SECTION = clone(DEFAULT_SECTION);
  clearLocal();
  render();
  buildForm();
  toast("已恢复默认内容");
});

/* —— 导出静态 HTML（不带脚本，可直接贴投放后台）—— */
$("sbgCopy").addEventListener("click", async () => {
  SECTION = clone(DRAFT);
  saveData(SECTION);
  render();

  const style = $("sbg-component-style").textContent;
  const html = "<!-- Card section -->\n<style>\n" + style.trim() + "\n</style>\n\n" +
               $("sbgSection").outerHTML + "\n\n" +
               "<script>\n" + sbgCarouselInit.toString() + "\n" +
               "document.querySelectorAll('.sbg-card__media').forEach(sbgCarouselInit);\n</" + "script>";

  try {
    await navigator.clipboard.writeText(html);
    toast("静态 HTML 已复制");
  } catch (err) {
    const ta = document.createElement("textarea");
    ta.value = html;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
    toast("静态 HTML 已复制");
  }
});
</script>
</body>
</html>
